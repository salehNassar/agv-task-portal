<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGV Task Portal</title>
  <meta name="description" content="Task board, timeline and schedule for the AGV mechanical phase (chassis, drive wheels and four-scissor lift).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='12' width='26' height='11' rx='2' fill='%232f6fde'/%3E%3Crect x='8' y='5' width='16' height='5' rx='1' fill='%23d9892b'/%3E%3Ccircle cx='10' cy='25' r='3' fill='%231b1f24'/%3E%3Ccircle cx='22' cy='25' r='3' fill='%231b1f24'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <h1 id="projectName">AGV Mechanical Phase</h1>
        <p id="projectSubtitle" class="subtitle"></p>
      </div>
      <div class="header-actions">
        <button id="themeBtn" class="icon-btn" type="button" title="Toggle light / dark" aria-label="Toggle light or dark theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
        <button id="adminBtn" class="btn btn-ghost" type="button">Team Leader</button>
      </div>
    </div>
    <div class="wrap">
      <div id="stats" class="stats" aria-live="polite"></div>
    </div>
  </header>

  <div id="adminBar" class="admin-bar" hidden></div>

  <nav class="toolbar wrap" aria-label="Views and filters">
    <div class="tabs" role="tablist">
      <button role="tab" data-view="board" type="button"><span class="hide-sm">Task </span>Board</button>
      <button role="tab" data-view="timeline" type="button">Timeline</button>
      <button role="tab" data-view="schedule" type="button"><span class="hide-sm">Weekly </span>Schedule</button>
      <button role="tab" data-view="team" type="button">Team</button>
      <button role="tab" data-view="docs" type="button">GitHub<span class="hide-sm"> &amp; Docs</span></button>
    </div>
    <div class="filters">
      <label class="field">
        <span>Member</span>
        <select id="memberFilter"></select>
      </label>
      <label class="field">
        <span>Category</span>
        <select id="categoryFilter"></select>
      </label>
      <label class="field grow">
        <span>Search</span>
        <input id="searchInput" type="search" placeholder="Task, code or keyword">
      </label>
    </div>
  </nav>

  <main id="app" class="wrap" tabindex="-1">
    <p class="loading">Loading tasks…</p>
  </main>

  <footer class="site-footer wrap">
    <span id="lastUpdated"></span>
    <span class="sep">·</span>
    <span>Read-only for team members. Updates are published by the team leader.</span>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn modal-x" type="button" data-close aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="importFile" type="file" accept=".js,.json,application/json,text/javascript" hidden>

  <script>
    // Load data.js with a cache-buster so the team always sees the latest published tasks.
    (function () {
      var s = document.createElement('script');
      s.src = 'data.js?v=' + Date.now();
      s.onload = s.onerror = function () {
        var a = document.createElement('script');
        a.src = 'app.js?v=' + Date.now();
        document.body.appendChild(a);
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
